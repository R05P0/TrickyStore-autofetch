# TrickyStore Autofetch configuration
# Edit this file, then reboot (or tap the module's Action to re-run now).
# This file lives at /data/adb/trickystore_autofetch/config.conf after install
# so your settings survive module updates.

# Source order (space separated). Known sources: specter  ddex  yurikey  upstream  custom
# - yurikey  : https://github.com/Yurii0307/yurikey  (base64; serial 3207..., known)
# - specter  : https://rawbin.dpejoh.com/catalog  (dpejoh's curated JSON catalog:
#              per-key serial/revoked/timestamp + "working"/"latest". We grab the
#              NEWEST non-revoked key; when it == the current one we do nothing, so
#              this acts as a MONITOR that auto-adopts the next fresh leak. Best source.)
# - ddex     : https://github.com/dare-devil-ex/keyboxxBot  (raw XML; DeviceID
#              "wkaie", a genuinely DIFFERENT key from yurikey, not in the CRL,
#              cert valid to 2030 — try it first when yurikey gets revoked)
# - upstream : KOWX712 Tricky-Addon keybox branch — DEAD since 2026-08 (0 bytes),
#              left only for back-compat; don't rely on it
# - custom   : your own URL (see CUSTOM_URL); may be raw XML or base64
SOURCES="specter ddex yurikey"

# Only used when 'custom' is listed in SOURCES.
CUSTOM_URL=""

# How often to check, in seconds. Default 6h. Minimum enforced: 1h.
INTERVAL=21600

# 1 = when the active keybox is revoked, automatically install a fresh valid one
#     and post a notification asking you to tap Apply.
# 0 = never write keybox.xml automatically; only notify that a refresh is due.
AUTO_INSTALL=1

# 1 = during Apply, also renew the PlayIntegrityFork fingerprint (runs PIF's
#     autopif, needs PIF installed + network). Keeps BASIC integrity green when a
#     canary/beta fingerprint expires. 0 = leave PIF untouched.
RENEW_PIF=1

# Google attestation revocation list (leaf-serial CRL). Leave as-is normally.
CRL_URL="https://android.googleapis.com/attestation/status"
